spring.application.name=DevFlow-api
# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/devflow
spring.datasource.username=devflow_user
spring.datasource.password=devflow_pass
spring.jpa.hibernate.ddl-auto=update
